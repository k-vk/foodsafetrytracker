name: Update and Deploy Food Safety Tracker

on:
  schedule:
    - cron: "30 2 * * *" # 08:00 IST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update dataset
        run: python scripts/update_tracker.py

      - name: Verify generated Pages data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("public/food_safety_incidents.json")

          if not path.exists():
              raise SystemExit(f"ERROR: {path} does not exist")

          with path.open(encoding="utf-8") as f:
              data = json.load(f)

          print("========================================")
          print(f"Records in Pages JSON: {len(data)}")

          if data:
              print(f"First record: {data[0].get('incident_id')}")
              print(f"Last record:  {data[-1].get('incident_id')}")
              print(f"Latest date:  {data[0].get('date_reported')}")
          else:
              print("WARNING: Pages JSON contains zero records")

          print("========================================")
          PY

      - name: Show changed files
        run: |
          echo "=== Git status ==="
          git status --short

          echo "=== Dataset file ==="
          ls -lh data/food_safety_incidents.csv

          echo "=== Public JSON ==="
          ls -lh public/food_safety_incidents.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ public/food_safety_incidents.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Daily food safety data update"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
          name: github-pages
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
