name: Update and Deploy Food Safety Tracker

on:
  schedule:
    - cron: "30 2 * * *" # 08:00 IST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update dataset
        run: python scripts/update_tracker.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ public/food_safety_incidents.json
          git diff --cached --quiet || git commit -m "Daily food safety data update"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5
      -  name: Verify public data
          run: |
            python - <<'PY'
            import json
            path = "public/food_safety_incidents.json"
            with open(path, encoding="utf-8") as f:
            data = json.load(f)
           print("================================")
           print(f"Records in Pages JSON: {len(data)}")
           print("First record:", data[0]["incident_id"])
           print("Last record:", data[-1]["incident_id"])
           print("================================")
           PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
